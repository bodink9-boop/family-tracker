<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Tracker Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Prompt", sans-serif;
        background: linear-gradient(180deg, #fffaf4, #f4efe7);
        color: #23180f;
      }

      .card {
        width: min(92vw, 420px);
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 20px 50px rgba(80, 48, 19, 0.12);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #6e6051;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ตอนนี้แอปออฟไลน์อยู่</h1>
      <p>สามารถเปิดหน้าหลักได้ แต่การติดตามพิกัดแบบสดต้องใช้อินเทอร์เน็ตหรือเครือข่ายที่เชื่อมถึงเซิร์ฟเวอร์อยู่ครับ</p>
    </div>
  </body>
  </html>
